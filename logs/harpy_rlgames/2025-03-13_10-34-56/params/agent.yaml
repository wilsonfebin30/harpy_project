params:
  adapt_fp16_precision: true
  algo:
    name: a2c_continuous
  config:
    async_training: false
    bounds_loss_coef: 0.0001
    clip_value: true
    critic_coef: 1.0
    device: cuda:0
    device_name: cuda
    e_clip: 0.2
    entropy_coef: 0.01
    env_name: rlgpu
    full_experiment_name: 2025-03-13_10-34-56
    gamma: 0.99
    grad_norm: 1.0
    horizon_length: 24
    kl_threshold: 0.01
    learning_rate: 0.001
    lr_schedule: adaptive
    max_epochs: 100
    mini_epochs: 5
    minibatch_size: 8192
    mixed_precision: true
    multi_gpu: false
    name: Harpy
    normalize_advantage: true
    normalize_input: true
    normalize_value: true
    num_actors: 4
    ppo: true
    reward_shaper:
      scale_value: 1.0
    save_best_after: 50
    save_frequency: 100
    score_to_win: 20000
    tau: 0.95
    train_dir: /home/febin/harpy_project/logs/harpy_rlgames
    truncate_grads: true
    use_diagnostics: true
    use_smooth_clamp: true
    value_bootstrap: true
    vec_env: true
  env:
    clip_actions: 1.0
    clip_observations: 10.0
    name: rlgpu
  initial_std: 0.4
  model:
    name: continuous_a2c_logstd
  network:
    mlp:
      activation: elu
      d2rl: false
      initializer:
        name: default
      units:
      - 512
      - 256
      - 128
    name: actor_critic
    separate: false
    space:
      continuous:
        mu_activation: tanh
        mu_init:
          name: default
        sigma_activation: none
        sigma_init:
          name: const_initializer
          val: 0
  player:
    deterministic: true
    games_num: 1000000
  replay_buffer:
    batch_size: 8192
    max_buffer_length: 1024
    replay_ratio: 0
    use_replay_buffer: false
  seed: 42
